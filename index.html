.wc{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -8px 22px rgba(0,0,0,.6)}
#lock{--k:clamp(52px,9.2vh,66px)}
#lock .logo{width:clamp(40px,7vh,52px);height:clamp(40px,7vh,52px);border-radius:13px}

.dots{gap:clamp(14px,2.4vh,18px);margin-bottom:clamp(20px,4.6vh,34px)}
.dots span{width:clamp(10px,1.6vh,12px);height:clamp(10px,1.6vh,12px)}
.pad{grid-template-columns:repeat(3,var(--k));gap:clamp(10px,1.9vh,14px) clamp(16px,3.6vw,22px)}
.pad button{width:var(--k);height:var(--k)}
.pad .n{font-size:clamp(21px,3.6vh,26px)}
.pad .l{font-size:clamp(7px,1.1vh,8.5px);min-height:9px}
.pad button[data-d="x"]{font-size:clamp(19px,3vh,22px)}
.cancel{margin-top:clamp(12px,2.4vh,18px);font-size:13px}

var RMK="lanka-assets-msg",RDEF="Dear Tenant,\nGreetings from LVR!\nThis is a gentle reminder that it is time for your monthly rent payment. Kindly arrange to pay the rent at your earliest convenience.\nWe sincerely appreciate your cooperation and thank you for being a valued tenant of LVR.\nWarm regards,\nLVR";

function sendWA(n,m){var a=document.createElement("a");a.href="https://wa.me/"+n+"?text="+encodeURIComponent(m);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
function remindSheet(){
var d=document.createElement("div"),unp=false,sent={},sel={},list=[],first=true;d.className="dlg";

ta.oninput=function(){try{localStorage.setItem(RMK,ta.value)}catch(e){}cloudQueue()};
function msg(){return ta.value.trim()||RDEF}
function mark(r){sent[r.n]=1;r.x.rem=iso(new Date());save()}
function paint(){
list=recips(unp);
if(first){list.forEach(function(r){sel[r.n]=true});first=false}
list.forEach(function(r){if(sel[r.n]===undefined)sel[r.n]=true});
var chosen=list.filter(function(r){return sel[r.n]}),left=chosen.filter(function(r){return !sent[r.n]}),go=d.querySelector("#rgo");
d.querySelector("#rmc").textContent=chosen.length+" of "+list.length+" selected";
d.querySelector("#rsa").textContent=(chosen.length===list.length&&list.length)?"Clear all":"Select all";
d.querySelector("#rml").innerHTML=list.length?list.map(function(r,i){return '<div class="rr" data-i="'+i+'"><span class="rck'+(sel[r.n]?' on':'')+'">'+(sel[r.n]?ic("check"):"")+'</span><span class="rav">'+esc(r.name.trim().charAt(0).toUpperCase())+'</span><div class="rrt"><b>'+esc(r.name)+'</b><small>'+esc(r.lab)+(r.x.rem?' \u00b7 reminded '+esc(dlab(r.x.rem)):'')+'</small></div>'+(sent[r.n]?'<span class="rsent">'+ic("check")+'</span>':'')+'<button class="rwa" data-i="'+i+'" aria-label="Send to this tenant on WhatsApp">'+ic("chat")+'</button></div>'}).join(""):'<div class="empty" style="padding:18px 6px">No tenants to remind.</div>';
d.querySelectorAll(".rr").forEach(function(row){row.onclick=function(e){var r=list[+row.dataset.i];if(e.target.closest(".rwa")){mark(r);sendWA(r.n,msg());paint();return}sel[r.n]=!sel[r.n];paint()}});
if(!list.length){go.disabled=true;go.innerHTML=ic("chat")+"Nothing to send"}
else if(!chosen.length){go.disabled=true;go.innerHTML=ic("chat")+"Select a tenant"}
else if(!left.length){go.disabled=true;go.innerHTML=ic("check")+"All reminders sent"}
else{go.disabled=false;go.innerHTML=ic("chat")+(left.length===chosen.length?(chosen.length===list.length?"Send to all ("+chosen.length+")":"Send to selected ("+chosen.length+")"):"Next: "+esc(left[0].name)+" ("+(chosen.length-left.length+1)+" of "+chosen.length+")")}
}
d.querySelector("#rsa").onclick=function(){var all=list.length&&list.every(function(r){return sel[r.n]});list.forEach(function(r){sel[r.n]=!all});paint()};
d.querySelector("#rgo").onclick=function(){var left=list.filter(function(r){return sel[r.n]&&!sent[r.n]});if(!left.length)return;var r=left[0];mark(r);sendWA(r.n,msg());paint()};
d.querySelectorAll(".seg1").forEach(function(b){b.onclick=function(){unp=b.dataset.u==="1";d.querySelectorAll(".seg1").forEach(function(c){c.classList.toggle("on",c===b)});paint()}});

d.onclick=function(e){if(e.target===d)d.remove()};

var RCK="lanka-assets-rcpt",RCDEF="Dear {name},\nGreetings from LVR!\nWe acknowledge with thanks the receipt of your rent for {month}, paid on {date} through {mode}.\nThank you for your timely payment and for being a valued tenant of LVR.\nWarm regards,\nLVR";
function rctpl(){try{return localStorage.getItem(RCK)||RCDEF}catch(e){return RCDEF}}
function rcmsg(tpl,x,key){var r=rv(x,key),dp=r&&r.d?r.d.split("-"):null,date=dp?(+dp[2]+" "+MN[+dp[1]-1]+" "+dp[0]):mlabel(key),mode=r&&r.m==="phone"?"online (PhonePe)":"cash";
return tpl.replace(/\{name\}/g,x.name||"Tenant").replace(/\{month\}/g,mlabel(key)).replace(/\{date\}/g,date).replace(/\{mode\}/g,mode)}
function rrecips(key){var r=[];S.forEach(function(f){f.files.forEach(function(x){var n=wa(x.phone),p=rv(x,key);if(!p||n.length<11||n.length>15)return;r.push({id:(x.id||x.t)+key,n:n,x:x,name:x.name||x.t,lab:f.n+" \u00b7 "+x.t,p:p})})});return r}
function receiptSheet(){
var cur=mk(),key=cur,d=document.createElement("div"),sent={},sel={},list=[];d.className="dlg";
d.innerHTML='<div class="box rm"><div class="rmh"><span class="rmi">'+ic("receipt")+'</span><b>Rent receipt</b><button class="rcl" id="rx" aria-label="Close">'+ic("close")+'</button></div><div class="rh"><button class="mv" id="mp" aria-label="Previous month">'+ic("back")+'</button><b id="rm"></b><button class="mv" id="mx" aria-label="Next month">'+ic("next")+'</button></div><textarea id="rmt" rows="6" aria-label="Message"></textarea><small class="hint">Use {name}, {month}, {date}, {mode} in the message</small><div class="rmc"><span id="rmc"></span><button class="rsa" id="rsa"></button></div><div class="rml" id="rml"></div><button class="rgo" id="rgo"></button></div>';
document.body.appendChild(d);
var ta=d.querySelector("#rmt");ta.value=rctpl();
ta.oninput=function(){try{localStorage.setItem(RCK,ta.value)}catch(e){}cloudQueue()};
function tpl(){return ta.value.trim()||RCDEF}
function mark(r){sent[r.id]=1;r.x.rs=r.x.rs||{};r.x.rs[key]=iso(new Date());save()}
function go1(r){mark(r);sendWA(r.n,rcmsg(tpl(),r.x,key))}
function paint(){
list=rrecips(key);
list.forEach(function(r){if(sel[r.id]===undefined)sel[r.id]=true});
var chosen=list.filter(function(r){return sel[r.id]}),left=chosen.filter(function(r){return !sent[r.id]}),go=d.querySelector("#rgo");
d.querySelector("#rm").textContent=mlabel(key);d.querySelector("#mx").disabled=key>=cur;
d.querySelector("#rmc").textContent=chosen.length+" of "+list.length+" selected";
d.querySelector("#rsa").textContent=(chosen.length===list.length&&list.length)?"Clear all":"Select all";
d.querySelector("#rml").innerHTML=list.length?list.map(function(r,i){var pd=r.p.d?dlab(r.p.d)+" \u00b7 ":"";return '<div class="rr" data-i="'+i+'"><span class="rck'+(sel[r.id]?' on':'')+'">'+(sel[r.id]?ic("check"):"")+'</span><span class="rav">'+esc(r.name.trim().charAt(0).toUpperCase())+'</span><div class="rrt"><b>'+esc(r.name)+'</b><small>'+esc(r.lab)+'</small><small>'+pd+(r.p.m==="phone"?"Online":"Cash")+(r.x.rs&&r.x.rs[key]?' \u00b7 receipt sent '+esc(dlab(r.x.rs[key])):'')+'</small></div>'+(sent[r.id]?'<span class="rsent">'+ic("check")+'</span>':'')+'<button class="rwa" data-i="'+i+'" aria-label="Send receipt on WhatsApp">'+ic("chat")+'</button></div>'}).join(""):'<div class="empty" style="padding:18px 6px">No paid rent with a WhatsApp number for '+esc(mlabel(key))+'.</div>';
d.querySelectorAll(".rr").forEach(function(row){row.onclick=function(e){var r=list[+row.dataset.i];if(e.target.closest(".rwa")){go1(r);paint();return}sel[r.id]=!sel[r.id];paint()}});
if(!list.length){go.disabled=true;go.innerHTML=ic("receipt")+"Nothing to send"}
else if(!chosen.length){go.disabled=true;go.innerHTML=ic("receipt")+"Select a tenant"}
else if(!left.length){go.disabled=true;go.innerHTML=ic("check")+"All receipts sent"}
else{go.disabled=false;go.innerHTML=ic("receipt")+(left.length===chosen.length?(chosen.length===list.length?"Send to all ("+chosen.length+")":"Send to selected ("+chosen.length+")"):"Next: "+esc(left[0].name)+" ("+(chosen.length-left.length+1)+" of "+chosen.length+")")}
}
d.querySelector("#rsa").onclick=function(){var all=list.length&&list.every(function(r){return sel[r.id]});list.forEach(function(r){sel[r.id]=!all});paint()};
d.querySelector("#rgo").onclick=function(){var left=list.filter(function(r){return sel[r.id]&&!sent[r.id]});if(!left.length)return;go1(left[0]);paint()};
function mv(n){var p=key.split("-");key=mk(new Date(+p[0],+p[1]-1+n,1));paint()}
d.querySelector("#mp").onclick=function(){mv(-1)};d.querySelector("#mx").onclick=function(){mv(1)};
d.querySelector("#rx").onclick=function(){d.remove()};
d.onclick=function(e){if(e.target===d)d.remove()};
paint();
}
var FBV="10.12.2",DEV=(function(){try{var d=localStorage.getItem("lva-dev");if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem("lva-dev",d)}return d}catch(e){return"dev"}})(),cloud={ready:false,loading:false,user:null,db:null,unsub:null,timer:null,state:"",pend:null,paint:null,err:""};
function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function cfg(){var c=window.FB_CONFIG;return(c&&c.apiKey&&c.projectId&&String(c.apiKey).indexOf("PASTE")<0)?c:null}
function ucache(){try{return JSON.parse(lg("lva-user"))}catch(e){return null}}
function localRev(){return +lg("lva-rev")||0}
function isDirty(){return lg("lva-dirty")==="1"}
function hasData(){return S.length!==4||S.some(function(f){return f.files.some(function(x){return x.name||x.phone||x.job||x.meter||x.adv||(x.r&&Object.keys(x.r).length)})})}
function freshS(){return DEF.map(function(x){var a=[];for(var f=0;f<x.c;f++)a.push({id:uid(),t:x.p+" "+(f+1),name:"",phone:"",job:"",meter:""});return{id:uid(),n:x.n,p:x.p,files:a}})}
function badge(){var b=document.getElementById("ba");if(!b)return;b.classList.remove("ok","pend");if(cloud.user||(!cloud.ready&&ucache()))b.classList.add(isDirty()||cloud.state==="err"?"pend":"ok")}
function accRefresh(){if(cloud.paint)cloud.paint()}
function setSynced(rev){ls("lva-rev",String(rev));ls("lva-dirty","0");if(cloud.user)ls("lva-uid",cloud.user.uid);ls("lva-last",String(Date.now()));cloud.state="ok";badge();accRefresh()}
function docRef(){return cloud.db.collection("users").doc(cloud.user.uid)}
function pushNow(){
if(!cloud.user||!cloud.db)return Promise.resolve();
clearTimeout(cloud.timer);var rev=Date.now();cloud.state="sync";badge();accRefresh();
return docRef().set({data:JSON.stringify(S),rem:lg(RMK),rcp:lg(RCK),rev:rev,device:DEV,by:cloud.user.email||""}).then(function(){setSynced(rev)}).catch(function(){cloud.state="err";ls("lva-dirty","1");badge();accRefresh()});
}
function cloudQueue(){if(typeof cloud==="undefined"||!cloud||!cloud.user)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushNow,1500)}
function doApply(d){try{var n=JSON.parse(d.data);if(Array.isArray(n)){S=n;ls(SK,JSON.stringify(S))}}catch(e){return}
if(d.rem)ls(RMK,d.rem);if(d.rcp)ls(RCK,d.rcp);setSynced(d.rev)}
function refreshView(){if(view==="home")out();else if(view==="folder"){if(cb<S.length)folder(cb);else home()}}
function applyCloud(d,live){
if(live&&view==="file"){cloud.pend=d;toast("New data from another device");return}
doApply(d);if(live)toast("Updated from another device");refreshView()}
function flushPend(){if(typeof cloud!=="undefined"&&cloud&&cloud.pend){var p=cloud.pend;cloud.pend=null;doApply(p)}}
function stopWatch(){if(cloud.unsub){try{cloud.unsub()}catch(e){}cloud.unsub=null}}
function startWatch(){stopWatch();if(!cloud.user)return;cloud.unsub=docRef().onSnapshot(function(snap){if(!snap.exists)return;var d=snap.data();if(d.device===DEV||d.rev<=localRev())return;if(isDirty())askConflict(d);else applyCloud(d,true)},function(){})}
function askConflict(d){
if(document.getElementById("cfd"))return;
var dd=document.createElement("div");dd.className="dlg";dd.id="cfd";
var when=d?new Date(d.rev).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"";
dd.innerHTML='<div class="box"><h3>Sync data</h3><p></p><div class="stk">'+(d?'<button class="vac" id="cu">Use cloud data<small>Replace the data on this phone</small></button><button class="vac" id="up">Upload this phone\u2019s data<small>Replace the copy in your account</small></button>':'<button class="vac" id="up">Upload this phone\u2019s data<small>Save it to this account</small></button><button class="vac" id="em">Start empty<small>Do not put this phone\u2019s data in this account</small></button>')+'<button class="no" id="lt">Decide later</button></div></div>';
dd.querySelector("p").textContent=d?"Your Google account already has saved data (last saved "+when+"). This phone also has data. Which should be kept?":"This phone has data from a different account. What should happen to it?";
document.body.appendChild(dd);
function close(){dd.remove()}
var cu=dd.querySelector("#cu");if(cu)cu.onclick=function(){close();doApply(d);refreshView()};
dd.querySelector("#up").onclick=function(){close();pushNow()};
var em=dd.querySelector("#em");if(em)em.onclick=function(){close();S=freshS();ls(SK,JSON.stringify(S));pushNow();refreshView()};
dd.querySelector("#lt").onclick=close;
}
function pullOrPush(){
if(!cloud.user)return;
docRef().get().then(function(snap){
var prev=lg("lva-uid"),same=prev===cloud.user.uid,d=snap.exists?snap.data():null;
if(!d){if(!prev||same)pushNow();else askConflict(null);startWatch();return}
if(same){if(d.rev===localRev()){if(isDirty())pushNow()}else if(d.rev<localRev()){pushNow()}else if(!isDirty()){applyCloud(d,false)}else askConflict(d);startWatch();return}
if(!hasData()){applyCloud(d,false)}else askConflict(d);startWatch()
}).catch(function(){cloud.state="err";badge();accRefresh()});
}
function onUser(u){

var PK="lanka-pass6",pass=null,buf="",first="",mode="enter",canCancel=false,lk=document.getElementById("lock");

function hs(s){s="LA"+s+"SS";var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return String(h)}

var T={enter:["LVR ASSETS","Enter your passcode"],"new":["Create Passcode","Set a 6-digit passcode to protect your data"],confirm:["Confirm Passcode","Enter it once more"]};
function paint(msg){var t=T[mode];lk.querySelector("h2").textContent=t[0];lk.querySelector("p").textContent=msg||t[1];lk.querySelectorAll(".dots span").forEach(function(s,i){s.classList.toggle("on",i<buf.length)});var c=document.getElementById("cn");c.textContent=canCancel?"Cancel":"";c.style.visibility=canCancel?"visible":"hidden"}
var busy=false;
function lockShow(m,c){mode=m;buf="";first="";busy=false;canCancel=!!c;lk.classList.remove("off");paint();var p=lk.querySelector(".pad");p.classList.remove("in");void p.offsetWidth;p.classList.add("in");p.querySelectorAll("button").forEach(function(b,i){b.style.animationDelay=(i*35)+"ms"})}
function unlock(){var d=lk.querySelector(".dots");busy=true;d.classList.add("ok");setTimeout(function(){lk.classList.add("off");buf="";busy=false;d.classList.remove("ok");paint()},450)}
function fail(msg){var d=lk.querySelector(".dots");busy=true;d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake","bad");setTimeout(function(){d.classList.remove("bad");buf="";busy=false;paint(msg)},500)}
function press(d){if(busy)return;if(d==="x"){buf=buf.slice(0,-1);paint();return}if(buf.length>=6)return;buf+=d;paint();var s=lk.querySelectorAll(".dots span")[buf.length-1];s.textContent=d;setTimeout(function(){s.textContent=""},380);if(buf.length===6)setTimeout(check,450)}
function check(){
if(mode==="enter"){if(hs(buf)===pass)unlock();else fail("Wrong passcode, try again")}
else if(mode==="new"){first=buf;buf="";mode="confirm";paint()}
else{if(buf===first){pass=hs(first);try{localStorage.setItem(PK,pass)}catch(e){}unlock()}else{mode="new";first="";fail("Passcodes did not match, start again")}}
}
lk.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){press(b.dataset.d)}});
document.getElementById("cn").onclick=function(){if(canCancel&&!busy){lk.classList.add("off");buf="";paint()}};
document.addEventListener("keydown",function(e){if(lk.classList.contains("off"))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("x")});
lockShow(pass?"enter":"new");
